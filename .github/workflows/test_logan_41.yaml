name: Logan Workflow 41

on:
  workflow_call:
    inputs:
      logan_github_environment:
        description: 'The GitHub environment to use for Logan'
        required: true
        type: string

jobs:
  run-test-logan-41:
    runs-on: ubuntu-latest
    environment: ${{ inputs.logan_github_environment }}
    steps:
      - name: Is Logan happy?
        run: |
          echo "Logan is happy: ${{ vars.LOGAN_IS_HAPPY }}"
      - name: Is Logan sad?
        env:
          LOGAN_IS_SAD: ${{ secrets.LOGAN_IS_NOT_HAPPY }}
        run: |
          echo "Logan is sad: $LOGAN_IS_SAD"